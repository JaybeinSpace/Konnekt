name: Extract Leticia portfolio images
on:
  push:
    paths:
      - '.github/workflows/extract-leticia-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leticia-mendoza-profile
      - name: Install image conversion dependency
        run: python -m pip install Pillow
      - name: Extract embedded images into portfolio asset paths
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import base64
          profile_b64=Path('assets/leticia-mendoza/profile.jpg.b64')
          if profile_b64.exists():
              (profile_b64.parent/'profile.jpg').write_bytes(base64.b64decode(profile_b64.read_text().strip()))
              profile_b64.unlink()
          outer=Path('next person.zip')
          if not outer.exists(): raise SystemExit('Missing next person.zip')
          mapping={
            '01-i-didnt-know-i-needed-this.jpg':'image13.png',
            '02-with-love.jpg':'image10.jpg',
            '03-intertwined-and-connected.jpg':'image9.jpg',
            '04-no-need-to-look-back.jpg':'image2.jpg',
            '05-plant.jpg':'image4.jpg',
            '06-the-chaos-of-emotions.jpg':'image8.jpg',
            '07-the-dynamics-of-a-relationship.jpg':'image6.jpg',
            '08-the-words-we-left-unsaid.jpg':'image3.jpg',
            '09-untitled.jpg':'image7.jpg',
            '10-erosion.jpg':'image12.jpg',
            '11-we-deserve-to-live-extension.jpg':'image11.jpg',
            '12-boricua-culture.jpg':'image5.jpg',
          }
          target=Path('assets/leticia-mendoza')
          target.mkdir(parents=True,exist_ok=True)
          with ZipFile(outer) as package:
              with ZipFile(BytesIO(package.read('next person.docx'))) as doc:
                  for output,source in mapping.items():
                      with Image.open(BytesIO(doc.read('word/media/'+source))) as im:
                          im.convert('RGB').save(target/output,'JPEG',quality=91,optimize=True)
                      print(output)
          PY
      - name: Commit artwork assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/leticia-mendoza/
          git rm -f -- 'next person.zip'
          if ! git diff --cached --quiet; then
            git commit -m "Extract Leticia artwork images from supplied DOCX"
            git push origin HEAD:feature/leticia-mendoza-profile
          fi
