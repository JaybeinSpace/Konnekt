name: Konnekt frontend regression tests

on:
  pull_request:
    paths:
      - "data.js"
      - "script.js"
      - "watch.js"
      - "credit-match*.js"
      - "tests/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches:
      - "feature/quincy-baker-draft-watch-film"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend regression tests
        run: node --test tests/*.test.cjs
      - name: Verify Quincy draft Instagram link in mobile and desktop Chrome
        run: node tests/quincy-profile-browser.cjs
